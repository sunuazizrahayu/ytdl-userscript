name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and version
        run: |
          set -euo pipefail
          node --check ytdl.js

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          META_VERSION=$(awk '/^\/\/ @version/ { print $3; exit }' ytdl.js | tr -d '[:space:]')
          CODE_VERSION=$(sed -n "s/^  const VERSION = '\([^']*\)';/\1/p" ytdl.js | head -n1 | tr -d '[:space:]')

          if [ -z "$META_VERSION" ] || [ -z "$CODE_VERSION" ]; then
            echo "::error::Could not read @version or const VERSION from ytdl.js"
            exit 1
          fi

          if [ "$META_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version mismatch: @version is $META_VERSION but const VERSION is $CODE_VERSION"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$META_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match @version $META_VERSION. Bump the version before tagging."
            exit 1
          fi

          echo "VERSION=$META_VERSION" >> "$GITHUB_ENV"
          echo "Tag $GITHUB_REF_NAME matches version $META_VERSION"

      - name: Build release asset
        run: cp ytdl.js ytdl.user.js

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ytdl.user.js --clobber
            echo "Updated asset on existing release $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$GITHUB_REF_NAME" ytdl.user.js \
              --title "YTDL $VERSION" \
              --verify-tag \
              --generate-notes
            echo "Published $GITHUB_REF_NAME with asset ytdl.user.js." >> "$GITHUB_STEP_SUMMARY"
          fi
