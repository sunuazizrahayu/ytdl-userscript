name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release asset
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a valid version (expected vX.Y.Z)."
            exit 1
          fi

          node --check ytdl.js

          # Inject the version from the tag into both places that carry it.
          sed -i -E "s|^// @version .*|// @version      ${VERSION}|" ytdl.js
          sed -i -E "s|^  const VERSION = '[^']*';|  const VERSION = '${VERSION}';|" ytdl.js

          grep -q "^// @version      ${VERSION}$" ytdl.js
          grep -q "^  const VERSION = '${VERSION}';$" ytdl.js

          node --check ytdl.js
          cp ytdl.js ytdl.user.js

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Injected version $VERSION into ytdl.user.js" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ytdl.user.js --clobber
            echo "Updated asset on existing release $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$GITHUB_REF_NAME" ytdl.user.js \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
            echo "Published $GITHUB_REF_NAME with asset ytdl.user.js." >> "$GITHUB_STEP_SUMMARY"
          fi
